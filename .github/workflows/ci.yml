name: ci

on:
  push:
  pull_request:

env:
  PYTHONUTF8: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ruff
      # Gated on the rules that catch real defects rather than style:
      # undefined names, unused imports, syntax errors and bugbear traps.
      # The full stylistic set (typing modernisation, complexity, magic
      # numbers) is reported but not enforced - see pyproject.toml.
      - name: ruff (correctness rules)
        run: ruff check --select F,E9,B002,B006,B012,B017,B904 .
      - name: ruff (full ruleset, advisory)
        run: ruff check --statistics . || true

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-cov pytest-mock pytest-timeout
      - name: pytest
        run: pytest -q -o addopts="" --timeout=120

  demo:
    name: demo boots from a clean clone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Install browser used by the static freeze smoke
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      # The promise on the README is that a clean clone produces a working
      # dashboard with no database. This job is what keeps that true.
      - name: Generate the synthetic dataset
        # Match the bounded portfolio dataset used by the Pages release. The
        # generator's much larger defaults produce a ~60 MB finest-grain cube,
        # outside the build's deliberately measured ~50 MB in-memory budget.
        run: python -m seed.generate_synthetic_data --months 6 --customers 110 --products 320 --suppliers 24

      - name: Seed auth and demo logins
        run: |
          cp .env.demo .env
          python manage.py init-auth-db
          python manage.py seed-demo-users

      - name: Walk every page and assert row-level security
        run: python scripts/demo_smoke.py

      # About fifteen tests skip themselves when no dataset exists - the
      # overview parity checks, which compare each API payload against the
      # authoritative fact-frame calculation, and the bundle endpoint smokes.
      # There is a dataset here, so run them for real rather than let CI report
      # green on a suite that skipped its own integration coverage.
      - name: Dataset-backed parity and bundle tests
        env:
          PARQUET_PATH: cache/fact_dataset
        run: |
          pip install pytest pytest-mock
          pytest -q -o addopts="" -rs \
            tests/test_overview_parity.py \
            tests/test_bundle_endpoints.py \
            tests/test_overview_bundle_payload.py \
            tests/test_page_load_budgets.py

      # Proves the static site can be produced from a clean checkout, and that
      # what it produces has no data request left in it. A page that still
      # fetches on load is the whole failure mode this build exists to remove,
      # so it fails the build rather than being noticed by a visitor.
      - name: Build the static site and check it makes no data requests
        env:
          PARQUET_PATH: cache/fact_dataset
        run: |
          python build_static.py --out dist --scopes current_fy --no-drilldowns --clean
          python scripts/check_static_build.py dist
