# Publish the prerendered demo to GitHub Pages.
#
# The live Flask app stays where it is; this is the copy a reviewer lands on.
# It exists because the free Render instance spins down, and a spun-down
# container costs 30-50s before any application code runs. That delay is not
# something the app can optimise away - it can only be avoided, and a CDN
# avoids it.
name: Static site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; `concurrency` stops two pushes racing to deploy.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          # build_static.py freezes each page in a real browser: that is what
          # turns JS-drawn charts into SVG that is present in the first paint,
          # and what lets it drop the payloads once they have been rendered.
          pip install playwright
          python -m playwright install --with-deps chromium

      # Must match the Dockerfile's seeding, and did not. The Docker image
      # builds the labor dataset, the products parquet and the returns tracker;
      # this workflow built only the fact dataset, so every static build since
      # the migration published a Labor page with no data in it - "Current
      # window n/a", the template's fallback subtitle, and none of its fourteen
      # charts, because `labor_bundle` had no parquet to read. The Flask app on
      # Render was fine, which is what hid it.
      - name: Seed the synthetic dataset and demo logins
        env:
          SECRET_KEY: static-build-seed-only-not-a-runtime-secret
        run: |
          cp .env.demo .env
          python -m seed.generate_synthetic_data --fiscal-years 3 --customers 110 --products 320 --suppliers 24
          python -m seed.generate_synthetic_labor --days 730
          python manage.py init-auth-db
          python manage.py seed-demo-users
          python manage.py build-products-parquet || echo "products parquet skipped"
          ENV=development FLASK_ENV=development \
            python -m seed.generate_synthetic_returns --count 140 --replace

      - name: Fail if the labor dataset is missing
        # The symptom is a page that renders and says "n/a", so assert the file
        # rather than trusting the build to notice.
        run: |
          test -s cache/labor/fact_dataset/labor_demo.parquet \
            || (echo "labor parquet was not generated" && exit 1)

      - name: Prerender every page and scope
        env:
          PARQUET_PATH: cache/fact_dataset
          # Pins the prebuilt-cache fingerprint to the commit, so a build never
          # reuses a value produced by different code.
          APP_BUILD_ID: ${{ github.sha }}
          # Let the build populate that cache as it goes. Scopes and drilldowns
          # re-ask for overlapping aggregates constantly, and with the cache
          # read-only every one of them recomputed from DuckDB.
          DEMO_PREBUILT_CACHE_DIR: cache/demo-prebuilt
          DEMO_PREBUILT_CACHE_READ: "1"
          DEMO_PREBUILT_CACHE_WRITE: "1"
          STATIC_LIVE_URL: https://wholesale-analytics-platform.onrender.com
        run: python build_static.py --out dist --clean

      - name: Check the build is actually static
        run: |
          python scripts/check_static_build.py dist
          python scripts/check_static_no_network.py dist

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Lighthouse performance budgets
        run: |
          npm install --global @lhci/cli@0.15.1
          lhci autorun --config=./lighthouserc.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
