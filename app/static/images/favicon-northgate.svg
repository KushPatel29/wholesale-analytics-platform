<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Northgate Retail Group">
  <title>Northgate Retail Group</title>
  <!-- The three ascending bars from the navbar wordmark, on their own.
       At 16px a wordmark is unreadable, so the tab carries only the mark.
       The rounded dark ground matches the app's default dark surface and
       keeps the light bars legible on a light browser chrome as well. -->
  <rect width="64" height="64" rx="14" fill="#0f1a17"/>
  <g>
    <rect x="14" y="36" width="10" height="16" rx="3" fill="#7cc4a4"/>
    <rect x="27" y="26" width="10" height="26" rx="3" fill="#4da37e"/>
    <rect x="40" y="12" width="10" height="40" rx="3" fill="#54c9a0"/>
  </g>
</svg>
