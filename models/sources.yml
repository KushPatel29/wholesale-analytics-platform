version: 2

sources:
  - name: synthetic_seed
    description: Synthetic source tables generated by seed/. No production data is represented.
    database: "{{ env_var('DBT_SOURCE_DATABASE', target.database) }}"
    schema: "{{ env_var('DBT_SOURCE_SCHEMA', 'SYNTHETIC_SEED') }}"
    tables:
      - name: sales_fact
        description: Order-line commercial fact used by the live application.
      - name: labor_fact
        description: Daily employee and paid-hours fact.
      - name: finance_month
        description: Monthly entity-level financial statement and balance snapshot.
      - name: marketing_campaign
        description: Monthly synthetic campaign spend and modelled lead counts.
      - name: forecast_backtest
        description: Rolling-origin forecast predictions and actuals by horizon.

  - name: returns_workflow
    description: Operational Returns workflow records; synthetic in the public demo.
    database: "{{ env_var('DBT_RETURNS_DATABASE', target.database) }}"
    schema: "{{ env_var('DBT_RETURNS_SCHEMA', 'RETURNS_APP') }}"
    tables:
      - name: return_rma
      - name: return_rma_item
      - name: return_corrective_actions
