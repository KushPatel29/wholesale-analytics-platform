version: 2

models:
  - name: fct_commercial_performance
    description: Governed monthly gross-to-net commercial performance. This model also owns the catalogue metadata consumed by the application.
    config:
      meta:
        metric_catalogue:
          - {key: "net_sales", name: "Net sales", formula: "Gross sales - Discounts - Returns - Costs associated with discounts and returns", grain: "Selected period", source_table: "sales_fact + return_rma", owner_page: "Overview", basis: "Net", status: "Implemented", certification: "Certified", model_name: "fct_commercial_performance"}
          - {key: "forecast_variance", name: "Forecast variance %", formula: "((Actual - Forecast) / Actual) * 100", grain: "Period / SKU / region / horizon", source_table: "sales_fact (rolling-origin backtest)", owner_page: "Planner", basis: "Transaction sales", status: "Implemented", certification: "Verified", model_name: "fct_forecast_performance"}
          - {key: "forecast_wape", name: "Forecast WAPE", formula: "sum(|Actual - Forecast|) / sum(Actual) * 100", grain: "Period / SKU / region / horizon", source_table: "sales_fact (rolling-origin backtest)", owner_page: "Planner", basis: "Transaction sales; executive headline", status: "Implemented", certification: "Certified", model_name: "fct_forecast_performance"}
          - {key: "forecast_smape", name: "Forecast SMAPE", formula: "mean(2 * |Actual - Forecast| / (|Actual| + |Forecast|)) * 100", grain: "Period / SKU / region / horizon", source_table: "sales_fact (rolling-origin backtest)", owner_page: "Planner", basis: "Transaction sales; bounded secondary diagnostic", status: "Implemented", certification: "Verified", model_name: "fct_forecast_performance"}
          - {key: "forecast_mape", name: "Forecast MAPE", formula: "mean(|Actual - Forecast| / Actual) * 100", grain: "Period / SKU / region / horizon", source_table: "sales_fact (rolling-origin backtest)", owner_page: "Planner", basis: "Transaction sales; diagnostic only on non-zero actuals", status: "Implemented", certification: "Diagnostic", model_name: "fct_forecast_performance"}
          - {key: "forecast_bias", name: "Forecast bias", formula: "mean(Forecast - Actual)", grain: "Period / SKU / region / horizon", source_table: "sales_fact (rolling-origin backtest)", owner_page: "Planner", basis: "Transaction sales", status: "Implemented", certification: "Certified", model_name: "fct_forecast_performance"}
          - {key: "forecast_hit_rate", name: "Forecast hit rate", formula: "% of periods within +/-X% tolerance", grain: "Period / SKU / region / horizon", source_table: "sales_fact (rolling-origin backtest)", owner_page: "Planner", basis: "Transaction sales", status: "Implemented", certification: "Verified", model_name: "fct_forecast_performance"}
          - {key: "retention", name: "Customer retention rate", formula: "(Customers at end of period - Customers added during period) / Customers at beginning * 100", grain: "Customer cohort and selected period", source_table: "sales_fact", owner_page: "Customers", basis: "Logo", status: "Implemented", certification: "Certified", model_name: "fct_customer_movement"}
          - {key: "churn", name: "Customer churn rate", formula: "Customers lost during period / Customers at start of period * 100", grain: "Customer cohort and selected period", source_table: "sales_fact", owner_page: "Customers", basis: "Logo and revenue-weighted", status: "Implemented", certification: "Certified", model_name: "fct_customer_movement"}
          - {key: "clv", name: "Customer lifetime value", formula: "(Avg transaction value * Avg transactions per year * Avg retention in years) * Profit margin", grain: "Customer / segment", source_table: "sales_fact", owner_page: "Customers", basis: "Gross-profit default; finite-horizon retention proxy and discount factor are disclosed", status: "Implemented", certification: "Verified", model_name: "fct_customer_movement"}
          - {key: "nrr", name: "Net revenue retention", formula: "(Starting revenue + Expansion - Contraction - Churn) / Starting revenue * 100", grain: "Account and selected period", source_table: "sales_fact", owner_page: "Overview / Customers", basis: "Transaction sales", status: "Implemented", certification: "Certified", model_name: "fct_customer_movement"}
          - {key: "arpa", name: "ARPA", formula: "Total revenue in period / Number of accounts in period", grain: "Selected period / account cohort", source_table: "sales_fact", owner_page: "Customers", basis: "Transaction sales", status: "Implemented", certification: "Verified", model_name: "fct_customer_movement"}
          - {key: "revenue_per_employee", name: "Revenue per employee", formula: "Total revenue / Number of employees", grain: "Selected period", source_table: "sales_fact + labor_fact", owner_page: "Labor", basis: "Transaction sales", status: "Implemented", certification: "Verified", model_name: "fct_labor_performance"}
          - {key: "revenue_per_paid_hour", name: "Revenue per paid hour", formula: "Total revenue / Paid hours", grain: "Selected period", source_table: "sales_fact + labor_fact", owner_page: "Labor", basis: "Transaction sales", status: "Implemented", certification: "Verified", model_name: "fct_labor_performance"}
          - {key: "turnover", name: "Employee turnover rate", formula: "Separations in period / ((opening headcount + closing headcount) / 2) * 100", grain: "Selected period / separation type", source_table: "labor_fact", owner_page: "Labor", basis: "Distinct employees; period rate, not annualized", status: "Implemented", certification: "Certified", model_name: "fct_labor_performance"}
          - {key: "gmroi", name: "GMROI", formula: "Gross margin $ / Average inventory cost", grain: "SKU / selected period", source_table: "sales_fact", owner_page: "Inventory", basis: "Gross margin", status: "Implemented", certification: "Verified", model_name: "fct_inventory_performance"}
          - {key: "sell_through", name: "Sell-through %", formula: "Units sold / Units available * 100", grain: "SKU / selected period", source_table: "sales_fact", owner_page: "Inventory", basis: "Units", status: "Implemented", certification: "Verified", model_name: "fct_inventory_performance"}
          - {key: "shrink", name: "Shrink %", formula: "(Book inventory - Physical inventory) / Book inventory * 100", grain: "SKU / physical count", source_table: "sales_fact inventory snapshot", owner_page: "Inventory", basis: "Units", status: "Implemented", certification: "Source-gated", model_name: "fct_inventory_performance"}
          - {key: "inventory_turns_usage", name: "Inventory turns (usage basis)", formula: "52 / Weeks on hand", grain: "SKU / selected period", source_table: "sales_fact inventory snapshot", owner_page: "Inventory", basis: "Usage basis off on-hand quantity; distinct from cost-basis Finance turnover", status: "Implemented", certification: "Verified", model_name: "fct_inventory_performance"}
          - {key: "return_rate", name: "Return rate", formula: "Returns / Orders * 100", grain: "Selected period", source_table: "return_rma + sales_fact", owner_page: "Returns", basis: "Orders", status: "Implemented", certification: "Certified", model_name: "fct_returns_performance"}
          - {key: "return_cost", name: "Return cost rate", formula: "Approved credit value / Net sales * 100", grain: "Selected period", source_table: "return_rma + sales_fact", owner_page: "Returns", basis: "Net", status: "Implemented", certification: "Certified", model_name: "fct_returns_performance"}
          - {key: "resolution", name: "Average return resolution", formula: "mean(closed_at - opened_at) across returns", grain: "Resolved return / selected period", source_table: "return_rma", owner_page: "Returns", basis: "Hours", status: "Implemented", certification: "Verified", model_name: "fct_returns_performance"}
          - {key: "return_rate_units", name: "Unit return rate", formula: "Captured returned quantity / shipped quantity * 100", grain: "Selected period / SKU", source_table: "return_rma_item + sales_fact", owner_page: "Returns", basis: "Units", status: "Implemented", certification: "Verified", model_name: "fct_returns_performance"}
          - {key: "return_rate_revenue", name: "Revenue return rate", formula: "Return credit value / sales revenue * 100", grain: "Selected period / SKU / customer", source_table: "return_rma_item + sales_fact", owner_page: "Returns", basis: "Revenue", status: "Implemented", certification: "Verified", model_name: "fct_returns_performance"}
          - {key: "preventable_return_rate", name: "Preventable return rate", formula: "Distinct orders with quality, damage, wrong-item, short/issue, or vendor returns / distinct sales orders * 100", grain: "Selected period / cause", source_table: "return_rma_item + sales_fact", owner_page: "Returns", basis: "Orders; explicit governed classification", status: "Implemented", certification: "Certified", model_name: "fct_returns_performance"}
          - {key: "return_reason_pareto", name: "Return reason Pareto", formula: "Cumulative return credit by reason / total return credit * 100", grain: "Reason / selected period", source_table: "return_rma_item", owner_page: "Returns", basis: "Credit dollars", status: "Implemented", certification: "Verified", model_name: "fct_returns_performance"}
          - {key: "return_adjusted_margin", name: "Return-adjusted margin", formula: "Sales revenue - sales cost - captured return credit", grain: "SKU / selected period", source_table: "return_rma_item + sales_fact", owner_page: "Returns", basis: "Gross margin dollars after returns", status: "Implemented", certification: "Certified", model_name: "fct_returns_performance"}
          - {key: "time_to_return", name: "Time to return", formula: "Return submitted timestamp - original order date", grain: "Returned order", source_table: "return_rma + sales_fact", owner_page: "Returns", basis: "Days; distribution shown", status: "Implemented", certification: "Verified", model_name: "fct_returns_performance"}
          - {key: "return_backlog_aging", name: "Returns backlog aging", formula: "Data cutoff - submitted date for unresolved returns", grain: "Open return / aging bucket", source_table: "return_rma", owner_page: "Returns", basis: "Days and open credit exposure", status: "Implemented", certification: "Verified", model_name: "fct_returns_performance"}
          - {key: "returns_workflow_sla", name: "Returns workflow SLA attainment", formula: "Completed transitions at or below target hours / completed transitions * 100", grain: "Workflow step / selected period", source_table: "return_rma workflow timestamps", owner_page: "Returns", basis: "24h approval, 48h finance, 72h resolution targets", status: "Implemented", certification: "Certified", model_name: "fct_returns_performance"}
          - {key: "repeat_returner_concentration", name: "Repeat-returner concentration", formula: "Return credit from customers with more than one return / total return credit * 100", grain: "Customer / selected period", source_table: "return_rma", owner_page: "Returns", basis: "Diagnostic; high-volume-customer false-positive caveat", status: "Implemented", certification: "Diagnostic", model_name: "fct_returns_performance"}
          - {key: "returns_customer_value_impact", name: "Returns customer-value impact", formula: "Customer gross profit before returns - captured return credits", grain: "Customer / selected period", source_table: "return_rma + sales_fact", owner_page: "Returns", basis: "Gross-profit input to CLV; not a separate lifetime forecast", status: "Implemented", certification: "Verified", model_name: "fct_returns_performance"}
          - {key: "corrective_action_impact", name: "Corrective-action realized impact", formula: "Expected outcome credit at baseline burden - actual outcome credit", grain: "Resolved returns corrective action", source_table: "return_corrective_action + return_rma + sales_fact", owner_page: "Returns / Overview", basis: "Measured before/after dollar impact", status: "Implemented", certification: "Certified", model_name: "fct_return_corrective_actions"}
          - {key: "quota", name: "Quota attainment", formula: "Sales achieved by rep or region / Goal for that rep or region * 100", grain: "Rep / region / month", source_table: "sales_fact quota", owner_page: "Sales Reps", basis: "Transaction sales", status: "Implemented", certification: "Verified", model_name: "fct_commercial_performance"}
          - {key: "gross_profit_margin", name: "Gross profit margin", formula: "(Revenue - COGS) / Revenue * 100", grain: "Any grain with revenue and cost", source_table: "sales_fact", owner_page: "Overview / Finance", basis: "Invoiced sales, revenue-weighted", status: "Implemented", certification: "Certified", model_name: "fct_commercial_performance"}
          - {key: "net_income", name: "Net income", formula: "Revenue - COGS - OpEx - Other - Interest - Taxes - D&A", grain: "Company / month / fiscal year", source_table: "finance_month + sales_fact", owner_page: "Finance", basis: "Invoiced sales; entity-level and not sliceable by operational filters", status: "Implemented", certification: "Certified", model_name: "fct_finance_monthly"}
          - {key: "net_profit_margin", name: "Net profit margin", formula: "Net income / Revenue * 100", grain: "Company / month / fiscal year", source_table: "finance_month + sales_fact", owner_page: "Finance", basis: "Invoiced sales; net-sales bridge shown separately", status: "Implemented", certification: "Certified", model_name: "fct_finance_monthly"}
          - {key: "current_ratio", name: "Current ratio", formula: "Current assets / Current liabilities", grain: "Company / month end", source_table: "finance_month", owner_page: "Finance", basis: "Month-end balance; multiple, not percent", status: "Implemented", certification: "Verified", model_name: "fct_finance_monthly"}
          - {key: "working_capital", name: "Working capital", formula: "Current assets - Current liabilities", grain: "Company / month end", source_table: "finance_month", owner_page: "Finance", basis: "Month-end balance", status: "Implemented", certification: "Verified", model_name: "fct_finance_monthly"}
          - {key: "ar_turnover", name: "AR turnover", formula: "Net credit sales / Average AR", grain: "Company / month / fiscal year", source_table: "finance_month", owner_page: "Finance", basis: "All sales are credit sales; short years are annualized and labelled", status: "Implemented", certification: "Verified", model_name: "fct_finance_monthly"}
          - {key: "ap_overdue", name: "AP overdue %", formula: "AP overdue / Total AP * 100", grain: "Company / month end", source_table: "finance_month", owner_page: "Finance", basis: "Month-end balance, past contractual due date", status: "Implemented", certification: "Verified", model_name: "fct_finance_monthly"}
          - {key: "roa", name: "Return on assets", formula: "Net income / Total assets * 100", grain: "Company / month / fiscal year", source_table: "finance_month", owner_page: "Finance", basis: "Net income over closing total assets", status: "Implemented", certification: "Verified", model_name: "fct_finance_monthly"}
          - {key: "inventory_turnover_cost", name: "Inventory turnover (cost basis)", formula: "COGS / Average inventory", grain: "Company / month / fiscal year", source_table: "finance_month", owner_page: "Finance", basis: "Cost basis; multiple, not percent", status: "Implemented", certification: "Verified", model_name: "fct_finance_monthly"}
          - {key: "cac", name: "Customer acquisition cost", formula: "Total marketing and sales spend / New customers", grain: "Company / month / fiscal year / channel", source_table: "marketing_campaign + finance_month + sales_fact", owner_page: "Marketing", basis: "Marketing spend plus 18% acquisition share of selling compensation", status: "Implemented", certification: "Verified", model_name: "fct_marketing_performance"}
          - {key: "cpl", name: "Cost per lead", formula: "Total marketing spend / New leads", grain: "Company / month / fiscal year / channel", source_table: "marketing_campaign", owner_page: "Marketing", basis: "Marketing spend; modelled lead counts", status: "Implemented", certification: "Diagnostic", model_name: "fct_marketing_performance"}
          - {key: "clv_cac", name: "CLV:CAC ratio", formula: "CLV / CAC", grain: "Company / fiscal year", source_table: "marketing_campaign + sales_fact", owner_page: "Marketing / Overview", basis: "12-month discounted gross-profit CLV over CAC", status: "Implemented", certification: "Verified", model_name: "fct_marketing_performance"}
          - {key: "cac_payback", name: "CAC payback", formula: "CAC / (Annual customer value / 12)", grain: "Company / fiscal year", source_table: "marketing_campaign + sales_fact", owner_page: "Marketing", basis: "Months of 12-month gross-profit CLV needed to repay acquisition cost", status: "Implemented", certification: "Verified", model_name: "fct_marketing_performance"}
          - {key: "romi", name: "ROMI", formula: "Incremental revenue attributable to marketing / Marketing investment", grain: "Campaign exposure / causal comparison period", source_table: "Requires campaign exposure plus holdout, experiment, or other incrementality source", owner_page: "Metric catalogue", basis: "Not applicable", status: "Not implemented - company-wide revenue movement is not a causal marketing return", certification: "Withheld", model_name: "fct_marketing_performance", missing_source: "Campaign spend exists, but customer exposure and a credible counterfactual do not. ROMI remains withheld until an experiment, holdout, or defensible incrementality model can isolate revenue caused by marketing."}
          - {key: "lead_response_time", name: "Lead response time", formula: "mean(first touch - lead created)", grain: "Lead", source_table: "Requires CRM touch timestamps", owner_page: "Metric catalogue", basis: "Not applicable", status: "Not implemented - campaign rows do not contain per-lead touches", certification: "Withheld", model_name: "fct_marketing_performance", missing_source: "The campaign layer contains spend and modelled aggregate lead counts, not a lead record with created and first-touch timestamps. A CRM activity source is required."}
          - {key: "mrr", name: "MRR / ARR", formula: "Subscription recurring revenue", grain: "Month", source_table: "Requires subscription billing", owner_page: "Metric catalogue", basis: "Not applicable", status: "Not implemented - domain mismatch", certification: "Withheld", model_name: "fct_finance_monthly", missing_source: "Northgate is an order-based retailer, not a subscription business. There is no recurring billing schedule or contract value source, so MRR and ARR would be fabricated."}
          - {key: "survey_scores", name: "NPS / eNPS / CSAT", formula: "Requires survey responses", grain: "Survey response", source_table: "Requires survey platform", owner_page: "Metric catalogue", basis: "Not applicable", status: "Not implemented - requires survey system", certification: "Withheld", model_name: "fct_customer_movement", missing_source: "No customer or employee survey responses, invitations, response dates, or population denominator exist. A governed survey platform export is required."}
          - {key: "web_funnel", name: "Web funnel metrics", formula: "Traffic and conversion measures", grain: "Web session", source_table: "Requires web analytics", owner_page: "Metric catalogue", basis: "Not applicable", status: "Not implemented - requires web analytics", certification: "Withheld", model_name: "fct_marketing_performance", missing_source: "The dataset begins at booked order lines and contains no sessions, events, anonymous identifiers, or consented identity joins. Web traffic and funnel conversion therefore cannot be computed."}
          - {key: "hris_metrics", name: "Training / hiring / diversity metrics", formula: "Requires employee lifecycle records", grain: "Employee", source_table: "Requires HRIS", owner_page: "Metric catalogue", basis: "Not applicable", status: "Not implemented - requires HRIS", certification: "Withheld", model_name: "fct_labor_performance", missing_source: "Daily labor facts support staffing and productivity, but not applications, training completions, demographic attributes, or governed HR lifecycle events. Those measures require an HRIS source."}
          - {key: "scrap", name: "Manufacturing scrap", formula: "Scrapped production / production", grain: "Production run", source_table: "Requires manufacturing system", owner_page: "Metric catalogue", basis: "Not applicable", status: "Not implemented - use retail shrink", certification: "Withheld", model_name: "fct_inventory_performance", missing_source: "Northgate has sales and inventory facts, not bills of material, work orders, production runs, or scrap events. Retail shrink is the valid domain measure."}
          - {key: "market_metrics", name: "Market share / industry growth", formula: "Company performance / external market", grain: "Market / period", source_table: "Requires external market data", owner_page: "Metric catalogue", basis: "Not applicable", status: "Not implemented - requires external data", certification: "Withheld", model_name: "fct_commercial_performance", missing_source: "Only Northgate's synthetic transactions are present. Market size, competitor revenue, and industry benchmarks require an external syndicated dataset with compatible grain."}
          - {key: "fulfillment_performance", name: "Fulfilment and delivery performance", formula: "Shipment and delivery events measured against promise timestamps", grain: "Shipment / order", source_table: "Requires fulfilment event stream", owner_page: "Metric catalogue", basis: "Not applicable", status: "Not implemented - no shipment or delivery events", certification: "Withheld", model_name: "fct_commercial_performance", missing_source: "Order lines exist, but pick, pack, ship, promise, carrier, delivery, and exception events do not. A warehouse or transport event source is required before OTIF-style fulfilment measures are defensible."}
          - {key: "crm_pipeline", name: "CRM pipeline performance", formula: "Opportunity value and stage movement over time", grain: "Opportunity / stage event", source_table: "Requires CRM opportunities and activities", owner_page: "Metric catalogue", basis: "Not applicable", status: "Not implemented - no opportunity lifecycle", certification: "Withheld", model_name: "fct_customer_movement", missing_source: "There are no opportunities, stages, activities, close dates, or stage-history records. Pipeline coverage, win rate, conversion, slippage, and sales cycle all require CRM history."}
          - {key: "procurement_performance", name: "Procurement and contract performance", formula: "PO, receipt, invoice, and contract measures", grain: "Purchase order / receipt / invoice", source_table: "Requires procurement system", owner_page: "Metric catalogue", basis: "Not applicable", status: "Not implemented - no PO, contract, or invoice records", certification: "Withheld", model_name: "fct_inventory_performance", missing_source: "Supplier names on sold products are not procurement transactions. Purchase orders, expected and actual receipts, contracts, and supplier invoices are required for purchase-price variance and contract utilization."}
          - {key: "service_case_sla", name: "Customer service case SLA", formula: "Case resolution and response time against SLA", grain: "Case / status event", source_table: "Requires ticketing system", owner_page: "Metric catalogue", basis: "Not applicable", status: "Not implemented - no service cases", certification: "Withheld", model_name: "fct_customer_movement", missing_source: "Returns workflow records are not a general customer-service ticket history. Case creation, queue, assignment, response, resolution, and SLA policy sources are required."}
          - {key: "same_store_sales", name: "Same-store sales", formula: "Sales growth for locations open in both comparable periods", grain: "Store / comparable period", source_table: "Requires stable store-location history", owner_page: "Metric catalogue", basis: "Not applicable", status: "Not implemented - no store grain", certification: "Withheld", model_name: "fct_commercial_performance", missing_source: "The seed contains regions but no durable store identifier, opening date, closure date, or location history. Regional sales cannot be relabelled as same-store sales."}
          - {key: "multi_touch_attribution", name: "Multi-touch attribution / ROAS", formula: "Attributed conversion value / advertising spend", grain: "Customer touch / campaign / conversion", source_table: "Requires consented touchpoint and exposure data", owner_page: "Metric catalogue", basis: "Not applicable", status: "Not implemented - no touchpoint exposure data", certification: "Withheld", model_name: "fct_marketing_performance", missing_source: "Campaign totals cannot identify which customers saw which messages or supply an attribution window. Consented impression, click, touchpoint, identity-resolution, and conversion-event sources are required."}
          - {key: "workforce_equity_engagement", name: "Pay equity / engagement / eNPS", formula: "Compensation and survey outcomes by governed workforce cohort", grain: "Employee / survey response", source_table: "Requires compensation and HR survey sources", owner_page: "Metric catalogue", basis: "Not applicable", status: "Not implemented - no compensation or engagement source", certification: "Withheld", model_name: "fct_labor_performance", missing_source: "Paid hours are not compensation bands or engagement evidence. Governed compensation, job level, protected-attribute controls, survey population, and response data are required."}
    columns:
      - name: metric_month
        data_tests: [unique, not_null]
      - name: net_sales
        data_tests: [not_null]

  - name: fct_customer_movement
    description: Customer-month revenue movement used for retention, churn, and NRR.
    columns:
      - name: metric_month
        data_tests: [not_null]
      - name: customer_id
        data_tests: [not_null]

  - name: fct_inventory_performance
    description: Weekly SKU demand and gross-margin inputs for inventory metrics.
    columns:
      - name: metric_week
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]

  - name: fct_labor_performance
    description: Monthly labor denominators and explicit separation events.
    columns:
      - name: metric_month
        data_tests: [unique, not_null]
      - name: opening_headcount
        data_tests: [not_null]
      - name: closing_headcount
        data_tests: [not_null]

  - name: fct_forecast_performance
    description: Rolling-origin actual and prediction pairs with signed error by horizon.
    columns:
      - name: forecast_date
        data_tests: [not_null]
      - name: target_date
        data_tests: [not_null]
      - name: horizon_weeks
        data_tests: [not_null]

  - name: fct_returns_performance
    description: Return workflow outcomes joined to return-line quantities.
    columns:
      - name: rma_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [not_null]

  - name: fct_return_corrective_actions
    description: Owned Returns root-cause actions with approval, outcome measurement, and realized dollar impact.
    columns:
      - name: corrective_action_id
        data_tests: [unique, not_null]
      - name: status
        data_tests: [not_null]

  - name: fct_finance_monthly
    description: Entity-month financial statement and balance inputs.

  - name: fct_marketing_performance
    description: Campaign-month spend and modelled lead counts; not causal attribution evidence.
